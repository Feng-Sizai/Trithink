name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check source and frontend
        run: npm run check
      - name: Prepare desktop dependencies
        run: npm run desktop:setup
      - name: Build Windows installer
        run: npm run desktop:package
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "release/三件事-$version-Windows-x64-安装程序.exe"
          $html = 'dist/三件事-试用版.html'
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $installer) -or -not (Test-Path -LiteralPath $notes)) { throw 'Release files are missing' }
          $checksums = @($installer, $html) | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path -Leaf $_)
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists -and $existing -eq 'false') {
            Write-Output "Release $tag is already published; existing assets were preserved."
            exit 0
          }
          if (-not $releaseExists) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "三件事 $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag $installer $html 'release/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
