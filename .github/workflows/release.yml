name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect existing release and normalize asset names
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $releaseJson = gh api "repos/$env:GH_REPO/releases/tags/v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            'build=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft) {
            'build=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $names = @{
            '.exe' = "Trithink-$version-Windows-x64-Setup.exe"
            '.html' = "Trithink-$version-Offline.html"
          }
          $checksums = @()
          $renamed = $false
          foreach ($extension in @('.exe', '.html')) {
            $assets = @($release.assets | Where-Object { $_.name.EndsWith($extension) })
            if ($assets.Count -ne 1) { throw 'Expected exactly one installer and one offline frontend' }
            $asset = $assets[0]
            $name = $names[$extension]
            if ($asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Published asset has no valid SHA256 digest' }
            if ($asset.name -ne $name) {
              gh api --method PATCH "repos/$env:GH_REPO/releases/assets/$($asset.id)" -f "name=$name" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not rename published asset' }
              $renamed = $true
            }
            $checksums += $asset.digest.Substring(7) + '  ' + $name
          }
          if ($renamed) {
            New-Item -ItemType Directory -Path release -Force | Out-Null
            [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
            gh release upload "v$version" 'release/SHA256SUMS.txt' --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update checksum names' }
          }
          'build=false' >> $env:GITHUB_OUTPUT
          Write-Output 'Published release verified; existing installer and frontend bytes were preserved.'
      - name: Check source and frontend
        if: steps.release_state.outputs.build == 'true'
        run: npm run check
      - name: Prepare desktop dependencies
        if: steps.release_state.outputs.build == 'true'
        run: npm run desktop:setup
      - name: Build Windows installer
        if: steps.release_state.outputs.build == 'true'
        run: npm run desktop:package
      - name: Publish versioned release
        if: steps.release_state.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "release/Trithink-$version-Windows-x64-Setup.exe"
          $html = "release/Trithink-$version-Offline.html"
          $notes = "docs/releases/$tag.md"
          Copy-Item -LiteralPath "release/三件事-$version-Windows-x64-安装程序.exe" -Destination $installer
          Copy-Item -LiteralPath 'dist/三件事-试用版.html' -Destination $html
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes are missing' }
          $checksums = @($installer, $html) | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path -Leaf $_)
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "三件事 $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag $installer $html 'release/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
